<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eagle X2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--pg:#0b0f1a;--ink:#0b0f1a;--teal:#1b273f;--brass:#c8a45a;--brass2:#e6c982;--ivory:#10275a;--ivory2:#0a1a42;--txt:#eef1f7;--mut:#94a3bf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:14px;background:var(--pg);font-family:Cairo,system-ui,sans-serif;line-height:1.9;color:var(--txt)}
.pass{width:100%;max-width:372px;border-radius:26px;overflow:hidden;display:grid;box-shadow:0 30px 70px #0009,0 0 0 1px #c8a45a33}
.head{background:radial-gradient(120% 100% at 50% 0,#1b273f,#0e1422 60%,#0b0f1a);color:#fff;text-align:center;padding:clamp(16px,3.2dvh,28px) 20px clamp(14px,2.6dvh,22px);display:grid;justify-items:center;gap:2px}
.head img{width:clamp(130px,23dvh,176px)}
.head h1{font:600 15px Cairo,sans-serif;letter-spacing:1.2px;color:#e6ebf5}
.id{direction:ltr;margin-top:clamp(6px,1.4dvh,12px);border:1px solid #c8a45a55;border-radius:999px;padding:3px 16px;font:500 clamp(11px,3.3vw,13px)/1.9 "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--brass2);white-space:nowrap}
.id i{font-style:normal;color:#94a3bf;margin-right:8px}
.body{background:linear-gradient(180deg,#0e1422,#0e1422);text-align:center;padding:clamp(16px,3dvh,26px) 24px;display:grid;gap:clamp(10px,2dvh,16px);align-content:center}
.body h2{display:flex;justify-content:center;align-items:center;gap:8px;font-size:20px;font-weight:800}
.body svg{width:20px;height:20px}
.body p{font-size:13.5px;color:var(--mut)}
.body p b{color:var(--txt);font-weight:800}
.cta{display:block;background:linear-gradient(180deg,#2a3a5e,#1b273f);color:var(--brass2);font:700 15px/1.6 Cairo,sans-serif;padding:11px;border-radius:12px;text-decoration:none;box-shadow:inset 0 0 0 1px #c8a45a66;transition:background .15s}
.cta:hover{filter:brightness(1.15)}.cta:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.stub{position:relative;background:linear-gradient(180deg,#1b273f,#19263c);text-align:center;padding:clamp(16px,3dvh,24px) 24px;display:grid;gap:10px;justify-items:center;align-content:center}
.stub::before{content:"";position:absolute;top:-1px;left:16px;right:16px;border-top:2px dashed #3a4a6a}
.stub::after{content:"";position:absolute;top:-12px;left:0;right:0;height:24px;background:radial-gradient(circle at 0 50%,var(--pg) 11px,transparent 12px) left/24px 24px no-repeat,radial-gradient(circle at 100% 50%,var(--pg) 11px,transparent 12px) right/24px 24px no-repeat}
.stub p{font-size:12.5px;line-height:2;color:var(--mut)}
.stub b{font:600 12.5px "IBM Plex Mono",monospace;color:var(--txt);unicode-bidi:isolate}
.tile{background:#fff;padding:6px;border-radius:12px;box-shadow:0 0 0 1.5px var(--brass)}
.tile img{display:block;width:clamp(88px,15dvh,120px);border-radius:8px}
@media (orientation:landscape) and (min-width:680px){
 .pass{max-width:900px;grid-template-columns:1.05fr 1.15fr .9fr}
 .head{padding:clamp(14px,4dvh,30px) 24px}
 .stub::before{top:16px;bottom:16px;left:auto;right:-1px;border-top:0;border-right:2px dashed #3a4a6a}
 .stub::after{top:0;bottom:0;left:auto;right:-12px;width:24px;height:auto;background:radial-gradient(circle at 50% 0,var(--pg) 11px,transparent 12px) top/24px 24px no-repeat,radial-gradient(circle at 50% 100%,var(--pg) 11px,transparent 12px) bottom/24px 24px no-repeat}
 .tile img{width:clamp(96px,26dvh,132px)}
}
</style></head><body>
