<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>Vibrant Mosaic — Exact HTML Layout</title>

<style>
/* =========================================================
   EXACT RECREATION — 1536 × 864
   ---------------------------------------------------------
   No full-screen screenshot is embedded.
   The galaxy is a separate BACKGROUND-ONLY asset; all UI
   elements (sidebar, text, icons, account area, clock) are
   real HTML/CSS/SVG.
   ---------------------------------------------------------
   Required files in the same folder:
     1) vibrant_mosaic_exact_html.html
     2) vibrant_mosaic_galaxy_background_only.png
   ========================================================= */

:root {
    --W: 1536px;
    --H: 730px;
    --TOP: 580px;

    --white: #f6f8fa;
    --muted: #85a4bc;
    --blue: #57caff;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: auto;
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}

/* =========================================================
   CANVAS
   ========================================================= */

.app {
    position: relative;
    width: var(--W);
    height: var(--H);
    overflow: hidden;
    background: #091a29;
    color: var(--white);
}

/* =========================================================
   EXACT GALAXY BACKGROUND — ONLY BACKGROUND, NO UI
   ========================================================= */

.galaxy-background {
    position: absolute;
    left: 0;
    top: 0;
    width: 1536px;
    height: 580px;
    z-index: 1;
    background-image: url("vibrant_mosaic_galaxy_background_only.png");
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 1536px 580px;
}

/* =========================================================
   SIDEBAR GLASS PANEL
   ========================================================= */

.sidebar {
    position: absolute;
    left: 33px;
    top: 88px;
    width: 308px;
    height: 466px;
    z-index: 20;

    padding: 58px 21px 0;

    border: 1px solid rgba(104, 171, 208, .25);
    border-radius: 21px;

    background:
        linear-gradient(
            145deg,
            rgba(22, 52, 73, .88) 0%,
            rgba(8, 28, 44, .84) 100%
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        inset 0 0 22px rgba(87,170,210,.045),
        0 17px 35px rgba(0,0,0,.30);

    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.nav-button {
    position: relative;
    width: 270px;
    height: 62px;

    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 25px;

    padding: 0 25px;

    border: 1px solid rgba(107, 163, 194, .14);
    border-radius: 18px;

    direction: ltr;
    text-align: left;

    color: #f2f6f9;
    background:
        linear-gradient(
            180deg,
            rgba(50, 86, 116, .54) 0%,
            rgba(21, 49, 71, .63) 100%

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 4px 10px rgba(0,0,0,.08);

    font: 700 30px/1 Tahoma, "Segoe UI", Arial, sans-serif;
    cursor: pointer;
}

.nav-button.active {
    border-color: rgba(82, 204, 255, .88);
    background:
        linear-gradient(
            180deg,
            rgba(46, 153, 221, .70) 0%,
            rgba(28, 106, 170, .73) 100%
        );

    box-shadow:
        inset 0 0 20px rgba(75, 205, 255, .16),
        0 0 16px rgba(26, 163, 225, .20);
}

.nav-button span:last-child {
    direction: rtl;
    white-space: nowrap;
}

/* =========================================================
   ICONS — SVG, REAL UI ELEMENTS
   ========================================================= */

.icon {
    width: 45px;
    height: 45px;
    flex: 0 0 45px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #eff8fd;
    filter: drop-shadow(0 0 4px rgba(93,207,255,.35));
}

.icon svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================================================
   ACCOUNT AREA
   ========================================================= */

.account {

    left: 0;
    right: 0;
    top: 580px;

/* =========================================================
   ACCOUNT TITLE
   ========================================================= */

.account-title {

    direction: ltr;
    white-space: nowrap;

/* =========================================================
   PROFILE
   ========================================================= */

.profile-ring {

.profile-icon {

.profile-icon svg {

/* =========================================================
   USER INFORMATION
   ========================================================= */

.user-info {

}

.user-label {

/* =========================================================

.clock {

/* =========================================================
   ORIENTATION SUPPORT
   ---------------------------------------------------------
   LANDSCAPE:
     Keep the original 1536×864 composition and scale it
     proportionally to the available viewport.

   PORTRAIT:
     Reflow the same visual language into a vertical canvas:
       1. Galaxy / atmospheric header
       2. Compact 2×2 navigation grid
       3. Account information block
     No horizontal overflow and no squashing of text/icons.
   ========================================================= */

/* Better viewport behavior on phones/tablets */
@supports (height: 100dvh) {
    html, body { min-height: 100dvh; }
}

/* -------------------------
   LANDSCAPE ENHANCEMENTS
   ------------------------- */
@media (orientation: landscape) {
    body {
        width: 100%;
        min-height: 100vh;
        overflow: auto;
    }

    .app {
        flex: 0 0 auto;
    }
}

/* -------------------------
   PORTRAIT
   ------------------------- */
@media (orientation: portrait) {

    html,
    body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background: #071522;
    }

    body {
        display: block;
    }

    .app {
        position: relative;
        width: 100vw;
        min-width: 0;
        height: auto;
        min-height: 100dvh;
        overflow: hidden;
        background: #081927;
    }

    /* =====================================================
       PORTRAIT TOP / GALAXY
       ===================================================== */

    .galaxy-background {
        position: relative;
        left: auto;
        top: auto;
        width: 100%;
        height: clamp(235px, 43vh, 360px);
        min-height: 235px;
        max-height: 360px;
        z-index: 1;

        background-size: cover;
        background-position: center center;
    }

    .galaxy-background::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34%;
        pointer-events: none;

        background:
            linear-gradient(
                180deg,
                transparent 0%,
                rgba(7,22,35,.18) 38%,
                #091a29 100%
            );
    }

    /* =====================================================
       PORTRAIT NAVIGATION
       Same order as landscape:
       الرئيسية
       الأفلام
       المسلسلات
       القنوات
       ===================================================== */

    .sidebar {
        position: relative;
        left: auto;
        top: auto;

        width: calc(100% - 28px);
        height: auto;

        margin: -24px 14px 0;
        padding: 14px;

        z-index: 20;

        border-radius: 20px;

        background:
            linear-gradient(
                145deg,
                rgba(22,52,73,.96) 0%,
                rgba(8,28,44,.96) 100%
            );

        border: 1px solid rgba(104,171,208,.27);

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.065),
            inset 0 0 24px rgba(87,170,210,.045),
            0 16px 36px rgba(0,0,0,.30);

        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
    }

    .nav {
        display: flex;
        flex-direction: column;
        width: 100%;
        gap: 9px;
    }

    .nav-button {
        width: 100%;
        height: 58px;

        min-width: 0;
        flex: none;

        padding: 0 18px;
        gap: 15px;

        border-radius: 15px;

        font-size: clamp(18px, 5vw, 24px);
        line-height: 1;
    }

    .nav-button span:last-child {
        overflow: visible;
        text-overflow: clip;
        white-space: nowrap;
    }

    .icon {
        width: 35px;
        height: 35px;
        flex: 0 0 35px;
    }

    /* =====================================================
       COMPACT ACCOUNT / INFO CARD
       ===================================================== */

    .account {
        position: relative;
        left: auto;
        right: auto;
        top: auto;
        bottom: auto;

        width: calc(100% - 28px);
        min-height: 0;

        margin: 14px 14px 20px;
        padding: 18px 18px 20px;

        border: 1px solid rgba(116,181,212,.18);
        border-radius: 20px;

        background:
            radial-gradient(
                ellipse 90% 120% at 50% 0%,
                rgba(19,55,79,.24),
                transparent 70%
            ),
            linear-gradient(
                180deg,
                #0a1b2b 0%,
                #091a29 100%
            );

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,.035),
            0 12px 28px rgba(0,0,0,.22);

        overflow: hidden;
    }

    /* =====================================================
       TITLE
       ===================================================== */

    .account-title {
        position: relative;
        left: auto;
        top: auto;

        display: block;

        padding: 0;
        margin: 0 0 16px;

        direction: ltr;
        text-align: left;
        white-space: nowrap;

        color: #f4f7fa;

        font-size: clamp(23px, 6.3vw, 31px);
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -.3px;
    }

    /* =====================================================
       PROFILE — SMALL, PROFESSIONAL
       ===================================================== */

    .profile-ring {
        position: absolute;

        left: 18px;
        top: 71px;

        width: 72px;
        height: 72px;

        border-width: 2px;
    }

    .profile-icon {
        position: absolute;

        left: 31px;
        top: 83px;

        width: 46px;
        height: 46px;
    }

    /* =====================================================
       USER INFORMATION — COMPACT ROWS
       ===================================================== */

    .user-info {
        position: relative;

        left: auto;
        top: auto;

        width: calc(100% - 82px);

        margin: 0 0 0 82px;
        padding: 0;

        direction: rtl;
        text-align: left;
    }

    .user-label {
        display: block;

        margin: 0 0 2px;

        color: #87a6bb;

        font-size: clamp(13px, 3.5vw, 16px);
        line-height: 1.15;
        font-weight: 500;
    }

    .username {
        display: block;

        direction: ltr;
        text-align: left;

        color: #f5f8fa;

        font-size: clamp(18px, 5vw, 25px);
        line-height: 1.18;
        font-weight: 700;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

        letter-spacing: 0;
    }

    .expiry {
        display: block;

        margin-top: 8px;

        direction: rtl;
        text-align: left;

        color: #86a3b8;

        font-size: clamp(12px, 3.35vw, 16px);
        line-height: 1.3;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .expiry strong {
        color: #82a1b7;
        font-weight: 700;
    }

    /* =====================================================
       CLOCK — SMALL HORIZONTAL INFORMATION STRIP
       ===================================================== */

    .clock {
        position: relative;

        right: auto;
        top: auto;

        display: flex;

        width: 100%;

        margin: 17px 0 0;
        padding-top: 12px;

        justify-content: flex-end;
        align-items: flex-start;

        direction: ltr;

        border-top: 1px solid rgba(112,177,209,.13);
    }

    .time {
        color: #f6f8fa;

        font-size: clamp(38px, 11vw, 55px);
        line-height: .95;

        font-weight: 700;

        letter-spacing: -2px;
    }

    .am {
        margin-left: 7px;
        margin-top: 2px;

        color: #82a3bd;

        font-size: clamp(13px, 3.7vw, 17px);
        line-height: 1.1;

        font-weight: 600;
    }
}

/* =========================================================
   TALL PORTRAIT PHONES — USE EXTRA VERTICAL SPACE NICELY
   ========================================================= */

    .galaxy-background {
        height: clamp(260px, 38vh, 360px);
        max-height: 360px;
    }

    .account {
        min-height: 0;
    }
}

/* =========================================================
   POSTERS — landscape: row beside the sidebar / portrait: row over the header
   To use a real image on any poster: style="--img:url('poster.jpg')"
   ========================================================= */
:root { --k: 1px; }
@media (max-width: 0px) { :root { --k: calc(100vw / 1536); } }

.posters {
    position: absolute;
    left: calc(380 * var(--k));
    right: calc(35 * var(--k));
    top: calc(88 * var(--k));
    height: calc(466 * var(--k));
    z-index: 15;
    direction: rtl;
}
.posters-title {
    margin: 0 calc(6 * var(--k)) calc(10 * var(--k));
    font: 700 calc(32 * var(--k))/1.2 Tahoma, "Segoe UI", Arial, sans-serif;
    color: var(--white);
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
}
.poster-row {
    display: flex;
    gap: calc(22 * var(--k));
    overflow-x: auto;
    overflow-y: hidden;
    padding: calc(14 * var(--k)) calc(6 * var(--k)) calc(26 * var(--k));
    scrollbar-width: none;
    scroll-snap-type: x proximity;
}
.poster-row::-webkit-scrollbar { display: none; }

.poster {
    position: relative;
    flex: 0 0 auto;
    width: calc(226 * var(--k));
    height: calc(340 * var(--k));
    border-radius: calc(16 * var(--k));
    overflow: hidden;
    cursor: pointer;
    scroll-snap-align: start;
    border: 1px solid rgba(255,255,255,.12);
    outline: none;
    background:
        var(--img, none) center / cover,
        radial-gradient(circle at 75% 22%, rgba(255,255,255,.26), transparent 45%),
        linear-gradient(160deg, var(--c1), var(--c2));
    box-shadow: 0 calc(10 * var(--k)) calc(24 * var(--k)) rgba(0,0,0,.4);
    transition: transform .2s, box-shadow .2s, border-color .2s;
}
.poster:hover,
.poster:focus-visible {
    transform: scale(1.05);
    border-color: rgba(82,204,255,.9);
    box-shadow: 0 0 calc(18 * var(--k)) rgba(26,163,225,.45), 0 calc(14 * var(--k)) calc(28 * var(--k)) rgba(0,0,0,.5);
    z-index: 2;
}
.poster-badge {
    position: absolute;
    top: calc(12 * var(--k));
    right: calc(12 * var(--k));
    padding: calc(4 * var(--k)) calc(10 * var(--k));
    border-radius: 999px;
    background: rgba(6,20,32,.72);
    color: #8fdcff;
    font-size: max(10px, calc(16 * var(--k)));
    font-weight: 700;
    direction: ltr;
}
.poster-info {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: calc(46 * var(--k)) calc(14 * var(--k)) calc(14 * var(--k));
    background: linear-gradient(transparent, rgba(4,14,24,.92));
}
.poster-name {
    display: block;
    color: #fff;
    font-size: calc(24 * var(--k));
    font-weight: 700;
    line-height: 1.2;
}
.poster-meta {
    display: block;
    margin-top: calc(4 * var(--k));
    color: var(--muted);
    font-size: max(10px, calc(16 * var(--k)));
}
.nav-button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

@media (orientation: portrait) {
    :root { --k: 1px; }

    .galaxy-background {
        height: clamp(200px, 30vh, 280px);
        min-height: 0;
        max-height: 280px;
    }
    .posters {
        position: relative;
        left: auto; right: auto; top: auto;
        height: auto;
        margin-top: -84px;
        z-index: 15;
    }
    .posters-title { margin: 0 16px 2px; font-size: clamp(18px, 5vw, 22px); }
    .poster-row { gap: 12px; padding: 12px 16px 18px; }
    .poster {
        width: clamp(112px, 31vw, 150px);
        height: clamp(168px, 46.5vw, 225px);
        border-radius: 14px;
    }
    .poster-name { font-size: clamp(13px, 3.6vw, 16px); }
    .poster-meta { font-size: 11px; }
    .poster-badge { top: 8px; right: 8px; padding: 3px 8px; font-size: 11px; }
    .poster-info { padding: 30px 10px 10px; }
    .sidebar { margin-top: 4px; }
}

/* LOGO — portrait only */
.brand-logo { display: none; }
@media (orientation: portrait) {
    .brand-logo {
        display: block;
        position: absolute;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: clamp(112px, 30vw, 136px);
        height: auto;
        z-index: 16;
        pointer-events: none;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
    }
}

@media (orientation: portrait) {
    .clock { position: absolute; top: 16px; right: 18px; width: auto; margin: 0; padding: 0; border-top: 0; }
    .time { font-size: clamp(26px, 7.5vw, 32px); line-height: 1; letter-spacing: -1px; }
    .am { margin-top: 1px; margin-left: 5px; font-size: clamp(11px, 3vw, 13px); }
}

/* ===== FIT-TO-SCREEN: nothing scrolls, whole UI always visible ===== */
@media (orientation: landscape) {
    html, body { height: 100%; min-height: 0; overflow: hidden; background: #091a29; }
    body { display: block; }
    .app {
        position: fixed; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(var(--s, 1));
        transform-origin: center center;
    }
    .account-title { left: 63px; top: 12px; font-size: 28px; line-height: 32px; }
    .profile-ring { left: 63px; top: 56px; width: 72px; height: 72px; border-width: 2px; }
    .profile-icon { left: 77px; top: 70px; width: 44px; height: 44px; }
    .user-info { left: 160px; top: 52px; width: 560px; }
    .user-label { margin-bottom: 2px; font-size: 16px; line-height: 20px; }
    .username { font-size: 28px; line-height: 32px; }
    .expiry { margin-top: 8px; font-size: 17px; line-height: 22px; }
    .clock { right: 35px; top: 58px; }
    .time { font-size: 52px; line-height: 54px; letter-spacing: -2px; }
    .am { margin-left: 8px; margin-top: 6px; font-size: 18px; line-height: 20px; }
}
@media (orientation: portrait) {
    html, body { height: 100%; overflow: hidden; }
    .app { height: 100vh; height: 100dvh; min-height: 0; display: flex; flex-direction: column; }
    .galaxy-background { flex: 1 1 0; height: auto; min-height: 0; max-height: none; }
    .posters { flex: 0 0 auto; margin-top: -8dvh; }
    .posters-title { margin: 0 16px; font-size: 16px; line-height: 1.3; }
    .poster-row { gap: 10px; padding: 6px 16px 10px; }
    .poster { height: clamp(110px, 20dvh, 200px); width: auto; aspect-ratio: 2 / 3; border-radius: 12px; }
    .sidebar { flex: 0 0 auto; width: calc(100% - 28px); margin: 18px 14px 0; padding: 8px; border-radius: 16px; }
    .nav { gap: clamp(4px, .8dvh, 7px); }
    .nav-button { height: clamp(36px, 5.6dvh, 50px); padding: 0 14px; gap: 12px; border-radius: 12px; font-size: clamp(15px, 2.3dvh, 20px); }
    .icon { width: 26px; height: 26px; flex: 0 0 26px; }
    .account { flex: 0 0 auto; width: calc(100% - 28px); margin: 8px 14px 10px; padding: 10px 14px 12px; border-radius: 16px; }
    .account-title { margin: 0 0 6px; font-size: 15px; line-height: 18px; }
    .profile-ring { left: 14px; top: 34px; width: 46px; height: 46px; }
    .profile-icon { left: 23px; top: 43px; width: 28px; height: 28px; }
    .user-info { width: calc(100% - 58px); margin: 0 0 0 58px; }
    .user-label { font-size: 11px; }
    .username { font-size: 16px; }
    .expiry { margin-top: 3px; font-size: 11px; }
    .clock { top: 8px; right: 14px; }
    .time { font-size: 22px; }
    .am { margin-left: 4px; margin-top: 0; font-size: 10px; }
}

</style>
</head>

document.getElementById('posterRow').innerHTML = POSTERS.map(([name, meta, rate, c1, c2]) =>

        <div class="poster-info"><span class="poster-name">${name}</span><span class="poster-meta">${meta}</span></div>

).join('');

function fitLandscape() {
    const land = innerWidth > innerHeight;
    document.documentElement.style.setProperty('--s', land ? Math.min(innerWidth / 1536, innerHeight / 730) : 1);
}
addEventListener('resize', fitLandscape);
addEventListener('orientationchange', fitLandscape);
fitLandscape();

const navButtons = document.querySelectorAll('.nav-button');

navButtons.forEach((button) => {
    button.addEventListener('click', () => {
        navButtons.forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
    });
});
